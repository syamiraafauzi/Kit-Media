<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room: Misi Menyelamat Diri (Bab 7 - Koordinat)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-deep: #070b19;
            --bg-panel: rgba(13, 21, 44, 0.92);
            --cyan-neon: #00f0ff;
            --purple-neon: #a855f7;
            --green-neon: #10b981;
            --amber-neon: #f59e0b;
            --red-neon: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 30%, #172146 0%, #060914 100%);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ================= WELCOME SCREEN ================= */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #18234b 0%, #050814 100%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-card {
            background: rgba(14, 22, 46, 0.96);
            border: 2px solid var(--cyan-neon);
            border-radius: 20px;
            padding: 34px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.3);
            text-align: center;
        }

        .welcome-badge {
            display: inline-block;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .welcome-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.65rem;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            margin: 0 0 8px 0;
        }

        .welcome-card p {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 22px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--cyan-neon);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #070c1d;
            border: 1.5px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--cyan-neon);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }

        .btn-start {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #041019;
            background: linear-gradient(135deg, #00f0ff, #10b981);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
            transition: transform 0.15s;
        }

        .btn-start:hover { transform: scale(1.02); }

        /* ================= HUD BAR ================= */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(8, 12, 26, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            z-index: 10;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hud-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .hud-pill {
            background: rgba(16, 26, 52, 0.95);
            border: 1.5px solid var(--cyan-neon);
            border-radius: 8px;
            padding: 5px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-pill.stage { border-color: var(--purple-neon); color: #e9d5ff; }
        .hud-pill.timer { border-color: var(--amber-neon); }

        .btn-hud {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 8px 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            transition: transform 0.15s;
        }
        .btn-hud:hover { transform: translateY(-2px); }
        .btn-formula { background: linear-gradient(135deg, #0284c7, #0369a1); border: 1px solid #38bdf8; }
        .btn-hint { background: linear-gradient(135deg, #9333ea, #6b21a8); border: 1px solid #c084fc; }
        .btn-sound { background: rgba(30, 41, 59, 0.9); border: 1px solid #64748b; }

        /* ================= ARENA & TERMINAL ================= */
        .game-stage {
            position: relative;
            flex: 1;
            width: 100%;
            height: calc(100vh - 58px);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .holo-terminal {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 385px;
            max-width: calc(100vw - 40px);
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1.5px solid var(--cyan-neon);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            z-index: 5;
        }

        .level-tag {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            margin-bottom: 8px;
        }

        .coord-badge {
            display: flex;
            justify-content: space-between;
            background: rgba(9, 14, 30, 0.9);
            border: 1px solid #334155;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 10px;
            color: #94a3b8;
        }
        .coord-badge strong { color: var(--cyan-neon); font-family: 'Orbitron', sans-serif; }

        .q-box {
            font-size: 1.05rem;
            line-height: 1.42;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 12px;
        }

        .hint-drawer, .fb-drawer {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: none;
        }
        .hint-drawer { background: rgba(147, 51, 234, 0.25); border-left: 3px solid #c084fc; color: #f3e8ff; }
        .fb-drawer.err { background: rgba(239, 68, 68, 0.25); border-left: 3px solid #ef4444; color: #fecaca; }

        .pin-screen {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .pin-screen input {
            flex: 1;
            background: #050814;
            border: 1.5px solid var(--cyan-neon);
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--cyan-neon);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            outline: none;
        }
        .pin-screen button {
            background: linear-gradient(135deg, #10b981, #059669);
            border: 1px solid #34d399;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .key-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #e2e8f0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            padding: 8px 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .key-btn:hover { background: rgba(0, 240, 255, 0.25); border-color: var(--cyan-neon); }
        .key-btn.del { background: rgba(239, 68, 68, 0.25); border-color: #f87171; }

        /* ================= MODALS ================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 18, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 60;
            padding: 20px;
        }

        .modal-card {
            background: #0f1733;
            border: 2px solid var(--cyan-neon);
            border-radius: 18px;
            padding: 26px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.35);
            text-align: center;
        }

        .modal-card h2 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 0;
        }

        .explain-box {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid #10b981;
            border-radius: 10px;
            padding: 14px;
            margin: 14px 0 18px 0;
            text-align: left;
            font-size: 1.02rem;
            line-height: 1.45;
            color: #ecfdf5;
        }

        .formula-item {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
