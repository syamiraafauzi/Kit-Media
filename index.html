<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misi Saya</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .mission-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0 0 20px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .mission-btn {
      position: relative;
      z-index: 5;
      pointer-events: auto;
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      background-color: #38bdf8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .mission-btn:hover:not(:disabled) {
      background-color: #7dd3fc;
    }

    .mission-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .mission-btn:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      font-size: 14px;
      color: #e2e8f0;
    }

    .reset-link {
      margin-top: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    .reset-link:hover {
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <main class="mission-card">
    <span class="badge">MISI HARIAN</span>
    <h1>Operasi Pagi</h1>
    <p>Tekan butang di bawah untuk memulakan misi dan mengaktifkan pemasa.</p>

    <button id="mulakanMisiBtn" class="mission-btn" type="button">
      Mulakan Misi
    </button>

    <div id="statusBox" class="status-box" role="status" aria-live="polite">
      Status: Menunggu misi dimulakan.
    </div>

    <button id="resetMisiBtn" class="reset-link" type="button" hidden>
      Set semula misi
    </button>
  </main>

  <script>
    const mulakanMisiBtn = document.getElementById("mulakanMisiBtn");
    const resetMisiBtn = document.getElementById("resetMisiBtn");
    const statusBox = document.getElementById("statusBox");

    let secondsElapsed = 0;
    let timerId = null;

    // Pastikan butang tidak disabled semasa mula
    mulakanMisiBtn.disabled = false;

    mulakanMisiBtn.addEventListener("click", () => {
      if (timerId !== null) return;

      mulakanMisiBtn.disabled = true;
      mulakanMisiBtn.textContent = "Misi Sedang Berjalan...";
      resetMisiBtn.hidden = false;

      secondsElapsed = 0;
      statusBox.textContent = "Status: Misi sedang berjalan — 0 saat";

      timerId = setInterval(() => {
        secondsElapsed += 1;
        statusBox.textContent = `Status: Misi sedang berjalan — ${secondsElapsed} saat`;
      }, 1000);
    });

    resetMisiBtn.addEventListener("click", () => {
      clearInterval(timerId);
      timerId = null;
      secondsElapsed = 0;

      mulakanMisiBtn.disabled = false;
      mulakanMisiBtn.textContent = "Mulakan Misi";
      resetMisiBtn.hidden = true;
      statusBox.textContent = "Status: Menunggu misi dimulakan.";
    });
  </script>
</body>
</html>
