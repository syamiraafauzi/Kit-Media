<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room: Misi Menyelamat Diri (Bab 7 - Koordinat)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-deep: #070b19;
            --bg-panel: rgba(13, 21, 44, 0.92);
            --cyan-neon: #00f0ff;
            --purple-neon: #a855f7;
            --green-neon: #10b981;
            --amber-neon: #f59e0b;
            --red-neon: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 30%, #172146 0%, #060914 100%);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ================= WELCOME SCREEN ================= */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #18234b 0%, #050814 100%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-card {
            background: rgba(14, 22, 46, 0.95);
            border: 2px solid var(--cyan-neon);
            border-radius: 20px;
            padding: 34px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.3);
            text-align: center;
        }

        .welcome-badge {
            display: inline-block;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .welcome-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.65rem;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            margin: 0 0 8px 0;
        }

        .welcome-card p {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 22px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--cyan-neon);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #070c1d;
            border: 1.5px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--cyan-neon);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }

        .btn-start {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #041019;
            background: linear-gradient(135deg, #00f0ff, #10b981);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
            transition: transform 0.15s;
        }

        .btn-start:hover { transform: scale(1.02); }

        /* ================= HUD BAR ================= */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(8, 12, 26, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            z-index: 10;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hud-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .hud-pill {
            background: rgba(16, 26, 52, 0.95);
            border: 1.5px solid var(--cyan-neon);
            border-radius: 8px;
            padding: 5px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-pill.stage { border-color: var(--purple-neon); color: #e9d5ff; }
        .hud-pill.timer { border-color: var(--amber-neon); }

            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 8px 13px;

            border: none;
