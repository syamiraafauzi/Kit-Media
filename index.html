<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room: Misi Menyelamat Diri (Isometrik 3D)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-deep: #0b0e1c;
            --bg-panel: rgba(16, 24, 46, 0.9);
            --cyan-neon: #00f0ff;
            --blue-glow: #2563eb;
            --purple-neon: #a855f7;
            --green-neon: #10b981;
            --amber-neon: #f59e0b;
            --red-neon: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 30%, #1a2142 0%, #090c18 100%);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(10, 14, 28, 0.92);
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            gap: 12px;
        }

        .hud-left, .hud-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-pill {
            background: rgba(18, 28, 54, 0.95);
            border: 1.5px solid var(--cyan-neon);
            border-radius: 10px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .hud-pill.timer {
            border-color: var(--amber-neon);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--cyan-neon);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            font-size: 1.05rem;
            text-align: center;
        }

        .btn-hud {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 9px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            transition: transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
        }
        .btn-hud:hover { transform: translateY(-2px); }
        .btn-formula {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        .btn-hint {
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            border: 1px solid #c084fc;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
        }

        .game-stage {
            position: relative;
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 64px);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .holo-terminal {
            position: absolute;
            top: 20px;
            right: 24px;
            width: 390px;
            max-width: calc(100vw - 48px);
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--cyan-neon);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 0 28px rgba(0, 240, 255, 0.22), inset 0 0 18px rgba(0, 240, 255, 0.08);
            z-index: 5;
        }
