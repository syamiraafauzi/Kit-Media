<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room 3D: Misi Menyelamat Diri (SP 7.1 Jarak)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-deep: #070b17;
            --bg-panel: rgba(14, 22, 44, 0.9);
            --cyan-neon: #00f0ff;
            --blue-glow: #2563eb;
            --purple-neon: #a855f7;
            --green-neon: #10b981;
            --amber-neon: #f59e0b;
            --red-neon: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 25%, #1a254d 0%, #070a14 100%);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Halaman Welcome */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, #172247 0%, #060913 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .welcome-card {
            max-width: 540px;
            width: 100%;
            background: rgba(13, 20, 40, 0.94);
            border: 2px solid var(--cyan-neon);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
            text-align: center;
        }

        .welcome-badge {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            margin-bottom: 12px;
        }

        .welcome-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            margin: 6px 0 10px;
            text-shadow: 0 0 14px rgba(0, 240, 255, 0.45);
        }

        .welcome-desc {
            color: #cbd5e1;
            font-size: 1.02rem;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            color: var(--cyan-neon);
            margin-bottom: 6px;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid #334155;
            background: #060b18;
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.08rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--cyan-neon);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }

        .btn-start {
            width: 100%;
            margin-top: 8px;
            padding: 13px 20px;
            border-radius: 10px;
            border: 1px solid #34d399;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
            transition: transform 0.15s;
        }

        .btn-start:hover { transform: translateY(-2px); }

        .welcome-err {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid #ef4444;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.92rem;
            margin-bottom: 12px;
            display: none;
        }

        /* Top HUD Bar */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(9, 13, 26, 0.94);
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hud-left, .hud-right {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .hud-pill {
            background: rgba(18, 28, 54, 0.95);
            border: 1.5px solid var(--cyan-neon);
            border-radius: 10px;
            padding: 5px 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.18);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
        }

        .hud-pill.timer {
            border-color: var(--amber-neon);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .hud-pill.player {
            border-color: #a78bfa;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 1.2px;
            color: var(--cyan-neon);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.55);
            font-size: 1rem;
        }

        .btn-hud {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.74rem;
            font-weight: 700;
            padding: 8px 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-hud:hover { transform: translateY(-2px); }

        .btn-formula {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 1px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
        }

        .btn-hint {
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            border: 1px solid #c084fc;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.35);
        }

        .game-stage {
            position: relative;
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 60px);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .cam-badge {
            position: absolute;
            bottom: 18px;
            left: 22px;
            background: rgba(11, 18, 38, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #bae6fd;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.74rem;
            pointer-events: none;
            z-index: 5;
        }

        .holo-terminal {
            position: absolute;
            top: 18px;
            right: 22px;
            width: 390px;
            max-width: calc(100vw - 44px);
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--cyan-neon);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 0 28px rgba(0, 240, 255, 0.22), inset 0 0 18px rgba(0, 240, 255, 0.08);
            z-index: 5;
        }

        .level-tag {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            margin-bottom: 8px;
        }

        .q-box {
            font-size: 1.05rem;
            line-height: 1.4;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 10px;
        }

        .coord-badge {
            display: flex;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #94a3b8;
        }

        .coord-badge span strong {
            color: var(--cyan-neon);
            font-family: 'Orbitron', sans-serif;
        }

        .hint-drawer, .fb-drawer {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.92rem;
            margin-bottom: 10px;
            display: none;
        }

        .hint-drawer {
            background: rgba(147, 51, 234, 0.2);
            border-left: 3px solid #c084fc;
            color: #f3e8ff;
        }

        .fb-drawer.err {
            background: rgba(239, 68, 68, 0.22);
            border-left: 3px solid #ef4444;
            color: #fecaca;
        }

        .pin-screen {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .pin-screen input {
            flex: 1;
            background: #060a14;
            border: 1.5px solid var(--cyan-neon);
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--cyan-neon);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }

        .pin-screen button {
            background: linear-gradient(135deg, #10b981, #059669);
            border: 1px solid #34d399;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .key-btn {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #e2e8f0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            padding: 7px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .key-btn:hover {
            background: rgba(0, 240, 255, 0.25);
            border-color: var(--cyan-neon);
        }

        .key-btn.del {
            background: rgba(239, 68, 68, 0.25);
            border-color: #f87171;
        }

        /* Modal Umum (Tahniah, Pintu Aras, Formula, Tamat) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 18, 0.84);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 60;
            padding: 16px;
        }

        .modal-card {
            background: #111936;
            border: 2px solid var(--cyan-neon);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.35);
            text-align: center;
        }

        .modal-card h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyan-neon);
            margin-top: 0;
            font-size: 1.3rem;
        }

        .explain-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.5);
            border-radius: 10px;
            padding: 14px;
            margin: 14px 0 18px;
            text-align: left;
            line-height: 1.5;
            font-size: 1.02rem;
            color: #e2e8f0;
        }

        .door-visual {
            font-size: 2.6rem;
            margin: 8px 0 12px;
        }

        .formula-item {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: left;
            font-size: 0.98rem;
        }
    </style>
</head>
<body>

    <!-- Halaman Welcome -->
    <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-card">
            <div class="welcome-badge">MATEMATIK TINGKATAN 2 • SP 7.1 JARAK</div>
            <h1>ESCAPE ROOM 3D: MISI MENYELAMAT DIRI</h1>
            <p class="welcome-desc">
                Bantu Pegawai Navigasi menghitung <strong>jarak mengufuk</strong>, <strong>jarak mencancang</strong>, dan <strong>jarak antara dua titik</strong> pada Satah Cartes isometrik 3D untuk membuka pintu setiap aras!
            </p>
            <div class="welcome-err" id="welcome-err">Sila masukkan Nama dan Kelas anda sebelum memulakan misi.</div>
            <div class="form-group">
                <label for="input-nama">NAMA PESERTA</label>
                <input type="text" id="input-nama" placeholder="Contoh: Aisyah Humaira">
            </div>
            <div class="form-group">
                <label for="input-kelas">KELAS</label>
                <input type="text" id="input-kelas" placeholder="Contoh: 2 Bestari">
            </div>
            <button class="btn-start" onclick="startGame()">MULA MISI →</button>
        </div>
    </div>

    <!-- HUD Atas -->
    <div class="hud-bar">
        <div class="hud-left">
            <div class="hud-pill player">👤 <span id="hud-player">
