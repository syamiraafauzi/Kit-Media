<!DOCTYPE html>
<html lang="ms">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room : Misi Menyelamatkan Diri — Bab 7 - Koordinat (Tingkatan 2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-deep: #0b0617;
            --bg-panel: rgba(24, 13, 46, 0.92);
            --purple-neon: #c084fc;
            --purple-bright: #a855f7;
            --purple-deep: #6b21a8;
            --violet-glow: #d8b4fe;
            --green-neon: #10b981;
            --amber-neon: #f59e0b;
            --red-neon: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 25%, #2b1254 0%, #090514 100%);
            color: #f3e8ff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Halaman Welcome Kreatif & Menarik */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, #331366 0%, #120726 52%, #06030e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 18px;
            overflow-y: auto;
        }

        .welcome-card {
            max-width: 860px;
            width: 100%;
            background: rgba(20, 10, 40, 0.96);
            border: 2px solid var(--purple-neon);
            border-radius: 20px;
            padding: 26px;
            box-shadow: 0 0 48px rgba(168, 85, 247, 0.34), inset 0 0 24px rgba(192, 132, 252, 0.08);
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 24px;
            align-items: center;
        }

        @media (max-width: 780px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .welcome-card {
            max-width: 880px;
            width: 100%;
            background: rgba(20, 10, 40, 0.96);
            border: 2px solid var(--purple-neon);
            border-radius: 20px;
            padding: 26px;
            box-shadow: 0 0 48px rgba(168, 85, 247, 0.34), inset 0 0 24px rgba(192, 132, 252, 0.08);
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 24px;
            align-items: center;
        }

        .briefing-card {
            max-width: 860px;
            width: 100%;
            background: rgba(22, 10, 46, 0.97);
            border: 2px solid #e879f9;
            border-radius: 20px;
            padding: 26px;
            box-shadow: 0 0 52px rgba(217, 70, 239, 0.34), inset 0 0 24px rgba(192, 132, 252, 0.08);
        }

        .threat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 16px 0 18px;
        }

        .threat-card {
            background: rgba(34, 15, 68, 0.9);
            border: 1.5px solid rgba(216, 180, 254, 0.35);
            border-radius: 14px;
            padding: 14px;
            text-align: left;
            transition: transform 0.2s, border-color 0.2s;
        }

        .threat-card:hover {
            transform: translateY(-3px);
            border-color: #e879f9;
        }

        @media (max-width: 780px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .welcome-card, .briefing-card {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 18px;
            }
            .threat-grid {
                grid-template-columns: 1fr;
            }
            .game-stage {
                height: calc(100vh - 96px) !important;
            }
            .holo-terminal {
                width: calc(100% - 24px) !important;
                right: 12px !important;
                top: 12px !important;
                max-height: 54vh;
                overflow-y: auto;
            }
        }

        .welcome-badge {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid var(--purple-neon);
            color: var(--violet-glow);
            margin-bottom: 10px;
            letter-spacing: 0.6px;
        }

        .welcome-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.48rem;
            font-weight: 900;
            color: #ffffff;
            margin: 4px 0 8px;
            text-shadow: 0 0 16px rgba(192, 132, 252, 0.6);
            line-height: 1.25;
        }

        .welcome-topic {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: #f0abfc;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .welcome-desc {
            color: #e9d5ff;
            font-size: 0.98rem;
            line-height: 1.48;
            margin-bottom: 14px;
        }

        .hazard-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 14px;
        }

        .hazard-chip {
            font-size: 0.82rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(88, 28, 135, 0.45);
            border: 1px solid rgba(216, 180, 254, 0.35);
            color: #fae8ff;
        }

        .art-showcase {
            background: linear-gradient(160deg, rgba(59, 7, 100, 0.55), rgba(15, 7, 32, 0.9));
            border: 1.5px solid rgba(192, 132, 252, 0.45);
            border-radius: 16px;
            padding: 12px;
            box-shadow: inset 0 0 22px rgba(168, 85, 247, 0.18);
        }

        .form-panel {
            background: rgba(15, 7, 32, 0.72);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 14px;
            padding: 18px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--purple-neon);
            margin-bottom: 6px;
            letter-spacing: 0.8px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1.5px solid #581c87;
            background: #0b0617;
            color: #faf5ff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.06rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--purple-neon);
            box-shadow: 0 0 14px rgba(192, 132, 252, 0.3);
        }

        .btn-start {
            width: 100%;
            margin-top: 6px;
            padding: 13px 20px;
            border-radius: 10px;
            border: 1px solid #e9d5ff;
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.45);
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 26px rgba(192, 132, 252, 0.65);
        }

        .welcome-err {
            color: #fecaca;
            background: rgba(239, 68, 68, 0.22);
            border: 1px solid #ef4444;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: none;
        }

        /* Top HUD Bar */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(14, 7, 28, 0.95);
            border-bottom: 1px solid rgba(192, 132, 252, 0.32);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
            z-index: 10;
            gap: 8px;
            flex-wrap: wrap;
        }

        .hud-left, .hud-right {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
        }

        .hud-pill {
            background: rgba(34, 16, 68, 0.95);
            border: 1.5px solid var(--purple-neon);
            border-radius: 10px;
            padding: 4px 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.74rem;
        }

        .hud-pill.timer {
            border-color: var(--amber-neon);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .hud-pill.player {
            border-color: #e879f9;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .hud-title-wrap {
            text-align: center;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: var(--purple-neon);
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.6);
            font-size: 0.92rem;
            line-height: 1.15;
        }

        .hud-sub {
            font-size: 0.76rem;
            color: #e9d5ff;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .btn-hud {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 7px 11px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-hud:hover { transform: translateY(-2px); }

        .btn-audio {
            background: linear-gradient(135deg, #581c87, #3b0764);
            border: 1px solid #c084fc;
        }

        .btn-formula {
            background: linear-gradient(135deg, #7e22ce, #581c87);
            border: 1px solid #d8b4fe;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        .btn-hint {
            background: linear-gradient(135deg, #a21caf, #701a75);
            border: 1px solid #f0abfc;
            box-shadow: 0 0 12px rgba(217, 70, 239, 0.35);
        }

        .game-stage {
            position: relative;
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 62px);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .cam-badge {
            position: absolute;
            bottom: 16px;
            left: 20px;
            background: rgba(24, 11, 48, 0.92);
            border: 1px solid rgba(192, 132, 252, 0.5);
            color: #f3e8ff;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            pointer-events: none;
            z-index: 5;
        }

        .cam-controls {
            position: absolute;
            bottom: 52px;
            left: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            z-index: 6;
        }

        .cam-btn {
            background: rgba(34, 15, 68, 0.92);
            border: 1px solid rgba(216, 180, 254, 0.5);
            color: #f3e8ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.12s, background 0.15s, border-color 0.15s;
        }

        .cam-btn:hover {
            background: rgba(147, 51, 234, 0.45);
            border-color: #f0abfc;
            transform: translateY(-1px);
        }

        .cam-btn.active {
            background: rgba(168, 85, 247, 0.55);
            border-color: #ffffff;
            color: #ffffff;
        }

        .map-hover-tip {
            position: absolute;
            display: none;
            pointer-events: none;
            background: rgba(19, 8, 40, 0.96);
            border: 1.5px solid #e879f9;
            color: #faf5ff;
            padding: 7px 11px;
            border-radius: 10px;
            font-size: 0.85rem;
            line-height: 1.35;
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.4);
            z-index: 15;
            white-space: nowrap;
        }

        .inspect-banner {
            background: rgba(88, 28, 135, 0.45);
            border: 1px solid rgba(232, 121, 249, 0.5);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            color: #fae8ff;
            margin-bottom: 10px;
            display: none;
        }

        .hint-drawer {
            background: rgba(168, 85, 247, 0.22);
            border-left: 3px solid #e879f9;
            color: #fae8ff;
        }

        .fb-drawer.err {
            background: rgba(239, 68, 68, 0.24);
            border-left: 3px solid #ef4444;
            color: #fecaca;
        }

        .pin-screen {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .pin-screen input {
            flex: 1;
            background: #0c0618;
            border: 1.5px solid var(--purple-neon);
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--violet-glow);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }

        .pin-screen button {
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            border: 1px solid #d8b4fe;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .key-btn {
            background: rgba(46, 20, 89, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.35);
            color: #f3e8ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            padding: 7px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .key-btn:hover {
            background: rgba(168, 85, 247, 0.32);
            border-color: var(--purple-neon);
        }

        .key-btn.del {
            background: rgba(239, 68, 68, 0.25);
            border-color: #f87171;
        }

        const SoundEngine = {
            ctx: null,
            enabled: true,
            bgTimer: null,

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.startBackground();
            },

            startBackground() {
                if (this.bgTimer || !this.enabled) return;
                const notes = [146.83, 196.00, 220.00, 293.66, 220.00, 196.00];
                let step = 0;

                this.bgTimer = setInterval(() => {
                    if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[step % notes.length], now);

                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(0.018, now + 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.75);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.8);
                    step++;
                }, 800);
            },

            stopBackground() {
                if (this.bgTimer) {
                    clearInterval(this.bgTimer);
                    this.bgTimer = null;
                }
            },

            toggle() {
                this.enabled = !this.enabled;
                const btn = document.getElementById('btn-toggle-audio');
                if (this.enabled) {
                    this.init();
                    btn.innerText = "🔊 Audio: ON";
                } else {
                    this.stopBackground();
                    btn.innerText = "🔇 Audio: OFF";
                }
            },

            playClick(pitch = 640) {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 0.65, now + 0.045);

                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.055);
            },

            playCorrect() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const freqs = [880, 1318.5];

                freqs.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const start = now + idx * 0.08;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, start);

                    gain.gain.setValueAtTime(0.001, start);
                    gain.gain.linearRampToValueAtTime(0.14, start + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.42);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(start);
                    osc.stop(start + 0.45);
                });
            },

            playWrong() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(195, now);
                osc.frequency.linearRampToValueAtTime(155, now + 0.24);

                gain.gain.setValueAtTime(0.09, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.28);
            },

            playDoorOpen() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const chord = [440, 554.37, 659.25, 880];
                chord.forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const t = now + i * 0.07;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, t);
                    gain.gain.setValueAtTime(0.08, t);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.38);
                });
            }
        };

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getBaseIsoMetrics() {
            const targetGrid = levels[currentLevelIdx].gridSize;
            const tileW = Math.min(canvas.width / (targetGrid * 1.95), 54);
            const tileH = tileW * 0.54;
            const originX = canvas.width * 0.36;
            const originY = canvas.height * 0.82;
            return { tileW, tileH, originX, originY };
        }

        function toIso(gx, gy) {
            const { tileW, tileH, originX, originY } = getBaseIsoMetrics();
            const rawX = originX + (gx - gy) * tileW;
            const rawY = originY - (gx + gy) * tileH;

            const centerX = canvas.width * 0.42;
            const centerY = canvas.height * 0.54;

            const screenX = (rawX - centerX) * camera.zoom + centerX + camera.panX;
            const screenY = (rawY - centerY) * camera.zoom + centerY + camera.panY;

            return {
                x: screenX,
                y: screenY,
                tileW: tileW * camera.zoom,
                tileH: tileH * camera.zoom
            };
        }

        // Tukar koordinat skrin (mouse/touch) kembali ke koordinat grid (gx, gy)
        function screenToGrid(sx, sy) {
            const { tileW, tileH, originX, originY } = getBaseIsoMetrics();
            const centerX = canvas.width * 0.42;
            const centerY = canvas.height * 0.54;

            const unzoomX = (sx - centerX - camera.panX) / camera.zoom + centerX;
            const unzoomY = (sy - centerY - camera.panY) / camera.zoom + centerY;

            const dx = unzoomX - originX;
            const dy = originY - unzoomY;

            const gx = 0.5 * (dx / tileW + dy / tileH);
            const gy = 0.5 * (dy / tileH - dx / tileW);

            const maxG = levels[currentLevelIdx].gridSize;
            const rx = Math.round(gx);
            const ry = Math.round(gy);
            if (rx < 0 || ry < 0 || rx > maxG || ry > maxG) return null;
            return { x: rx, y: ry };
        }

        function manualZoom(delta) {
            SoundEngine.init();
            SoundEngine.playClick(690);
            camera.targetZoom = Math.min(2.2, Math.max(0.65, camera.targetZoom + delta));

        function focusCameraOnGrid(gx, gy) {
            if (!autoZoomEnabled) return;
            const { tileW, tileH, originX, originY } = getBaseIsoMetrics();
            const rawX = originX + (gx - gy) * tileW;
            const rawY = originY - (gx + gy) * tileH;
            const centerX = canvas.width * 0.42;
            const centerY = canvas.height * 0.54;

            camera.targetZoom = 1.48;
            camera.targetPanX = (centerX - rawX) * 1.48;
            camera.targetPanY = (centerY - rawY) * 1.48;
            document.getElementById('cam-status').innerText = `KAMERA: ZOOM PERGERAKAN (${Math.round(gx)},${Math.round(gy)})`;
        }

        // Peta 3D bertekstur: rumput berlapis, batu/boulder, sungai beralun + jambatan kayu, jalan raya, pokok 3D & grid Cartes
        function drawIsoFloor() {
            const gridSteps = Math.max(2, Math.round(animatedGridSize));
            const slabDepth = 18 * camera.zoom;

            const pOrigin = toIso(0, 0);
            const pRight = toIso(animatedGridSize, 0);
            const pTop = toIso(animatedGridSize, animatedGridSize);
            const pLeft = toIso(0, animatedGridSize);

            // Lapisan asas 3D tebal (tanah gelap + lapisan rumput bawah)
            ctx.beginPath();
            ctx.moveTo(pLeft.x, pLeft.y);
            ctx.lineTo(pOrigin.x, pOrigin.y);
            ctx.lineTo(pOrigin.x, pOrigin.y + slabDepth);
            ctx.lineTo(pLeft.x, pLeft.y + slabDepth);
            ctx.closePath();
            ctx.fillStyle = "#240b4c";
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(pOrigin.x, pOrigin.y);
            ctx.lineTo(pRight.x, pRight.y);
            ctx.lineTo(pRight.x, pRight.y + slabDepth);
            ctx.lineTo(pOrigin.x, pOrigin.y + slabDepth);
            ctx.closePath();
            ctx.fillStyle = "#34095c";
            ctx.fill();

            for (let gx = 0; gx < gridSteps; gx++) {
                for (let gy = 0; gy < gridSteps; gy++) {
                    const p1 = toIso(gx, gy);
                    const p2 = toIso(gx + 1, gy);
                    const p3 = toIso(gx + 1, gy + 1);
                    const p4 = toIso(gx, gy + 1);

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.lineTo(p4.x, p4.y);
                    ctx.closePath();

                    const isRiver = (gx === 4 || gx === 5) && gy >= 1 && gy <= Math.min(gridSteps - 1, 11);
                    const isBridge = (gx === 4 || gx === 5) && gy === 5;
                    const isRoad = (gy === 5 && gx >= 6 && gx <= Math.min(gridSteps - 1, 14)) ||
                                   (gx === 14 && gy >= 5 && gy <= Math.min(gridSteps - 1, 10));
                    const isForest = (gx < 4 && gy < 6) || (gx >= 6 && gx <= 9 && gy >= 8 && gy <= 12);

                    if (isBridge) {
                        ctx.fillStyle = "rgba(146, 64, 14, 0.85)";
                    } else if (isRiver) {
                        const wave = Math.sin(Date.now() / 320 + gx * 1.4 + gy * 0.9) * 0.1;
                        ctx.fillStyle = `rgba(14, 165, 233, ${0.55 + wave})`;
                    } else if (isRoad) {
                        ctx.fillStyle = (gx + gy) % 2 === 0 ? "rgba(71, 85, 105, 0.72)" : "rgba(51, 65, 85, 0.68)";
                    } else if (isForest) {
                        ctx.fillStyle = (gx + gy) % 2 === 0 ? "rgba(21, 128, 61, 0.42)" : "rgba(20, 83, 45, 0.36)";
                    } else {
                        ctx.fillStyle = (gx + gy) % 2 === 0 ? "rgba(139, 92, 246, 0.23)" : "rgba(109, 40, 217, 0.16)";
                    }
                    ctx.fill();

                    // Sorotan petak hover atau terpilih
                    const isHover = hoveredTile && hoveredTile.x === gx && hoveredTile.y === gy;
                    const isSel = selectedTile && selectedTile.x === gx && selectedTile.y === gy;
                    if (isHover || isSel) {
                        ctx.fillStyle = isSel ? "rgba(240, 171, 252, 0.35)" : "rgba(216, 180, 254, 0.22)";
                        ctx.fill();
                    }

                    ctx.strokeStyle = "rgba(216, 180, 254, 0.25)";
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Papan kayu melintang pada jambatan sungai
                    if (isBridge) {
                        ctx.strokeStyle = "#fde68a";
                        ctx.lineWidth = 1.4 * camera.zoom;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }

            // Riak air sungai berkilau
            for (let ry = 2; ry <= Math.min(gridSteps - 1, 10); ry++) {
                if (ry === 5) continue;
                const rippleOffset = Math.sin(Date.now() / 450 + ry) * 0.25;
                const w1 = toIso(4.3 + rippleOffset, ry + 0.3);
                const w2 = toIso(4.8 + rippleOffset, ry + 0.5);
                ctx.strokeStyle = "rgba(186, 230, 253, 0.65)";
                ctx.lineWidth = 1.6 * camera.zoom;
                ctx.beginPath();
                ctx.moveTo(w1.x, w1.y);
                ctx.lineTo(w2.x, w2.y);
                ctx.stroke();
            }

            // Garis pembahagi jalan raya
            if (gridSteps >= 8) {
                const rStart = toIso(6.5, 5.5);
                const rMid = toIso(14.5, 5.5);
                ctx.beginPath();
                ctx.moveTo(rStart.x, rStart.y);
                ctx.lineTo(rMid.x, rMid.y);
                if (gridSteps >= 10) {
                    const rEnd = toIso(14.5, Math.min(gridSteps - 0.5, 10.5));
                    ctx.lineTo(rEnd.x, rEnd.y);
                }
                ctx.strokeStyle = "rgba(253, 224, 71, 0.72)";
                ctx.lineWidth = 1.6 * camera.zoom;
                ctx.setLineDash([5 * camera.zoom, 5 * camera.zoom]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Bingkai luar peta 3D
            ctx.beginPath();
            ctx.moveTo(pOrigin.x, pOrigin.y);
            ctx.lineTo(pRight.x, pRight.y);
            ctx.lineTo(pTop.x, pTop.y);
            ctx.lineTo(pLeft.x, pLeft.y);
            ctx.closePath();
            ctx.strokeStyle = "#e879f9";
            ctx.lineWidth = 2.4 * camera.zoom;
            ctx.stroke();

            // Paksi X & Y
            const xEnd = toIso(animatedGridSize + 0.6, 0);
            const yEnd = toIso(0, animatedGridSize + 0.6);

            ctx.lineWidth = 3.2 * camera.zoom;
            ctx.strokeStyle = "#f0abfc";
            ctx.beginPath();
            ctx.moveTo(pOrigin.x, pOrigin.y);
            ctx.lineTo(xEnd.x, xEnd.y);
            ctx.stroke();

            ctx.strokeStyle = "#c084fc";
            ctx.beginPath();
            ctx.moveTo(pOrigin.x, pOrigin.y);
            ctx.lineTo(yEnd.x, yEnd.y);
            ctx.stroke();

            ctx.font = `bold ${Math.round(14 * camera.zoom)}px Orbitron`;
            ctx.fillStyle = "#f5d0fe";
            ctx.fillText("X", xEnd.x + 8, xEnd.y + 4);
            ctx.fillText("Y", yEnd.x - 16, yEnd.y - 4);

            ctx.font = `bold ${Math.round(10 * camera.zoom)}px Orbitron`;
            ctx.fillStyle = "#e9d5ff";
            const labelStep = gridSteps > 14 ? 2 : 1;
            for (let i = 1; i <= gridSteps; i += labelStep) {
                const px = toIso(i, 0);
                ctx.fillText(i, px.x - 4, px.y + 14 * camera.zoom);
                const py = toIso(0, i);
                ctx.fillText(i, py.x - 16 * camera.zoom, py.y + 4);
            }
        }

        // Lukis kelompok anjing liar yang bergerak di peta
        function drawWildDogs() {
            const maxVisible = levels[currentLevelIdx].gridSize;
            dogPack.forEach((dog, idx) => {
                if (dog.x > maxVisible || dog.y > maxVisible) return;
                const p = toIso(dog.x, dog.y);
                const s = camera.zoom * 1.15;
                const trot = Math.sin(Date.now() / 110 + idx * 2) * 3 * s;

                // Bayang & amaran merah/ungu
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, 11 * s, 5.5 * s, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(239, 68, 68, 0.25)";
                ctx.fill();

                // Badan anjing liar
                ctx.fillStyle = "#92400e";
                ctx.beginPath();
                ctx.roundRect(p.x - 7 * s, p.y - 12 * s - trot * 0.3, 14 * s, 7 * s, 3 * s);
                ctx.fill();

                // Kepala & telinga tajam
                ctx.fillStyle = "#b45309";
                ctx.beginPath();
                ctx.arc(p.x + 7 * s, p.y - 14 * s - trot * 0.3, 4.5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#78350f";
                ctx.beginPath();
                ctx.moveTo(p.x + 5 * s, p.y - 17 * s - trot * 0.3);
                ctx.lineTo(p.x + 7 * s, p.y - 21 * s - trot * 0.3);
                ctx.lineTo(p.x + 9 * s, p.y - 17 * s - trot * 0.3);
                ctx.closePath();
                ctx.fill();

                // Kaki bergerak
                ctx.strokeStyle = "#451a03";
                ctx.lineWidth = 2.4 * s;
                ctx.beginPath();
                ctx.moveTo(p.x - 4 * s, p.y - 5 * s);
                ctx.lineTo(p.x - 4 * s + trot, p.y);
                ctx.moveTo(p.x + 4 * s, p.y - 5 * s);
                ctx.lineTo(p.x + 4 * s - trot, p.y);
                ctx.stroke();

                if (idx === 0) {
                    ctx.font = `bold ${Math.round(9.5 * s)}px Orbitron`;
                    ctx.fillStyle = "#fca5a5";
                    ctx.fillText("🐕 ANJING LIAR", p.x - 28 * s, p.y - 25 * s);
                }
            });
        }

        function draw3DLandmarkModel(lm) {
            const maxVisible = levels[currentLevelIdx].gridSize;
            if (lm.x > maxVisible || lm.y > maxVisible) return;

            const p = toIso(lm.x, lm.y);
            const s = camera.zoom * 1.38;
            const pulse = Math.sin(Date.now() / 250) * 3 * s;

            ctx.beginPath();
            ctx.ellipse(p.x + 3 * s, p.y + 2 * s, (17 * s) + pulse, (8.5 * s) + pulse * 0.5, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(10, 4, 24, 0.6)";
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(p.x, p.y, 16 * s, 8 * s, 0, 0, Math.PI * 2);
            ctx.fillStyle = lm.type === "exit" ? "rgba(192,132,252,0.35)" : "rgba(168,85,247,0.22)";
            ctx.fill();
            ctx.strokeStyle = "#e879f9";
            ctx.lineWidth = 1.6 * s;
            ctx.stroke();

            if (lm.type === "forest") {
                // Pokok hutan 3D berlapis
                ctx.fillStyle = "#78350f";
                ctx.fillRect(p.x - 2.5 * s, p.y - 14 * s, 5 * s, 14 * s);
                ctx.fillStyle = "#15803d";
                ctx.beginPath();
                ctx.moveTo(p.x, p.y - 32 * s);
                ctx.lineTo(p.x - 13 * s, p.y - 11 * s);
                ctx.lineTo(p.x + 13 * s, p.y - 11 * s);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#22c55e";
                ctx.beginPath();
                ctx.moveTo(p.x, p.y - 38 * s);
                ctx.lineTo(p.x - 10 * s, p.y - 21 * s);
                ctx.lineTo(p.x + 10 * s, p.y - 21 * s);
                ctx.closePath();
                ctx.fill();
            } else if (lm.type === "river_bank") {
                // Tiang penanda sungai & pelampung
                ctx.fillStyle = "#0284c7";
                ctx.beginPath();
                ctx.arc(p.x, p.y - 6 * s, 9 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#bae6fd";
                ctx.lineWidth = 2 * s;
                ctx.stroke();
            } else if (lm.type === "road_post") {
                // Papan tanda jalan raya 3D
                ctx.fillStyle = "#64748b";
                ctx.fillRect(p.x - 2 * s, p.y - 24 * s, 4 * s, 24 * s);
                ctx.fillStyle = "#f59e0b";
                ctx.fillRect(p.x - 12 * s, p.y - 28 * s, 24 * s, 8 * s);
            } else if (lm.type === "dog_zone") {
                // Menara amaran zon anjing liar
                ctx.strokeStyle = "#f0abfc";
                ctx.lineWidth = 2.2 * s;
                ctx.beginPath();
                ctx.moveTo(p.x - 9 * s, p.y);
                ctx.lineTo(p.x, p.y - 28 * s);
                ctx.lineTo(p.x + 9 * s, p.y);
                ctx.stroke();
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(p.x, p.y - 30 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();
            } else if (lm.type === "exit") {
                // Pondok Selamat 3D
                const w = 30 * s, h = 42 * s;
                ctx.fillStyle = "#4c1d95";
                ctx.strokeStyle = "#e879f9";
                ctx.lineWidth = 2.2 * s;
                ctx.fillRect(p.x - w / 2, p.y - h + 12 * s, w, h - 12 * s);
                ctx.strokeRect(p.x - w / 2, p.y - h + 12 * s, w, h - 12 * s);

                ctx.fillStyle = "#c084fc";
                ctx.beginPath();
                ctx.moveTo(p.x - w / 2 - 4 * s, p.y - h + 12 * s);
                ctx.lineTo(p.x, p.y - h - 4 * s);
                ctx.lineTo(p.x + w / 2 + 4 * s, p.y - h + 12 * s);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#fde047";
                ctx.fillRect(p.x - 4 * s, p.y - 11 * s, 8 * s, 11 * s);
            } else {
                // Kem Mula (0,0)
                ctx.fillStyle = "#7e22ce";
                ctx.beginPath();
                ctx.moveTo(p.x - 11 * s, p.y);
                ctx.lineTo(p.x, p.y - 20 * s);
                ctx.lineTo(p.x + 11 * s, p.y);
                ctx.closePath();
                ctx.fill();
            }

            ctx.font = `bold ${Math.round(10.5 * s)}px Rajdhani`;
            ctx.fillStyle = "#fae8ff";
            const labelOffsetY = lm.type === "exit" ? -50 * s : -36 * s;
            ctx.fillText(`${lm.label} (${lm.x},${lm.y})`, p.x - 28 * s, p.y + labelOffsetY);
        }

        function drawLandmarksAndPath() {
            if (pathHistory.length > 1) {
                ctx.beginPath();
                pathHistory.forEach((pt, idx) => {
                    const p = toIso(pt[0], pt[1]);
                    if (idx === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                const currP = toIso(playerPos.x, playerPos.y);
                ctx.lineTo(currP.x, currP.y);

                ctx.strokeStyle = "#f0abfc";
                ctx.lineWidth = 3.5 * camera.zoom;
                ctx.setLineDash([7 * camera.zoom, 4 * camera.zoom]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            landmarks.forEach(lm => draw3DLandmarkModel(lm));
            drawWildDogs();
        }

        function drawCharacter(gx, gy) {
            const p = toIso(gx, gy);
            const s = camera.zoom * 1.48;
            const bounce = isWalking ? Math.abs(Math.sin(walkCycle)) * 7 * s : Math.sin(Date.now() / 280) * 2.5 * s;
            const legSwing = isWalking ? Math.sin(walkCycle) * 6 * s : 0;

            const cx = p.x;
            const cy = p.y - bounce;

            ctx.beginPath();
            ctx.ellipse(p.x, p.y, 13 * s, 6.5 * s, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(10, 4, 24, 0.65)";
            ctx.fill();

            ctx.strokeStyle = "#1e1b4b";
            ctx.lineWidth = 4.6 * s;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(cx - 4 * s, cy - 13 * s);
            ctx.lineTo(cx - 5 * s - legSwing, cy - 1 * s);
            ctx.moveTo(cx + 4 * s, cy - 13 * s);
            ctx.lineTo(cx + 5 * s + legSwing, cy - 1 * s);
            ctx.stroke();

            ctx.fillStyle = "#7e22ce";
            ctx.beginPath();
            ctx.roundRect(cx - 8 * s, cy - 28 * s, 16 * s, 16 * s, 4 * s);
            ctx.fill();
            ctx.strokeStyle = "#e879f9";
            ctx.lineWidth = 1.4 * s;
            ctx.stroke();

            ctx.fillStyle = "#fed7aa";
            ctx.beginPath();
            ctx.arc(cx, cy - 36 * s, 7 * s, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#3b0764";
            ctx.beginPath();
            ctx.arc(cx, cy - 38 * s, 7 * s, Math.PI, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f0abfc";
            ctx.fillRect(cx - 4.8 * s, cy - 37 * s, 9.6 * s, 2.4 * s);

            if (!isWalking) {
                const bx = cx + 13 * s;
                const by = cy - 52 * s;
                ctx.fillStyle = "#faf5ff";
                ctx.beginPath();
                ctx.roundRect(bx - 8.5 * s, by - 10.5 * s, 17 * s, 16 * s, 4 * s);
                ctx.fill();

                ctx.fillStyle = "#3b0764";
                ctx.font = `bold ${Math.round(12 * s)}px Orbitron`;
                ctx.fillText("?", bx - 4 * s, by + 2 * s);
            }
        }

        function animate() {
            updateCameraAndGrid();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawIsoFloor();
            drawLandmarksAndPath();

            if (isWalking) {
                const dx = targetPos.x - playerPos.x;
                const dy = targetPos.y - playerPos.y;
                const dist = Math.hypot(dx, dy);
                const speed = 0.085;

                if (dist > speed) {
                    playerPos.x += (dx / dist) * speed;
                    playerPos.y += (dy / dist) * speed;
                    walkCycle += 0.35;
                    focusCameraOnGrid(playerPos.x, playerPos.y);
                } else {
                    playerPos.x = targetPos.x;
                    playerPos.y = targetPos.y;
                    isWalking = false;
                    walkCycle = 0;

                    clearTimeout(zoomHoldTimer);
                    zoomHoldTimer = setTimeout(() => {
                        resetCameraOverview();
                        if (pendingExplain) {
                            const expText = pendingExplain;
                            pendingExplain = null;
                            showCongratsModal(expText);
                        }
                    }, 520);
                }
            }

            drawCharacter(playerPos.x, playerPos.y);
            requestAnimationFrame(animate);
        }

        function getCurrentLevel() {
            return levels[currentLevelIdx];
        }

        function getCurrentQuestion() {
            return getCurrentLevel().questions[currentQIdx];
        }

        function loadQuestion() {
            const lvl = getCurrentLevel();
            const q = getCurrentQuestion();
            document.getElementById('hud-stage').innerText = lvl.name;
            document.getElementById('hud-scale').innerText = `${lvl.gridSize}×${lvl.gridSize}`;
            document.getElementById('hud-progress').innerText = `${currentQIdx + 1} / ${lvl.questions.length}`;
            document.getElementById('q-level').innerText = lvl.tag;
            document.getElementById('q-text').innerText = q.text;
            document.getElementById('curr-coord').innerText = `(${Math.round(playerPos.x)},${Math.round(playerPos.y)})`;
            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('fb-box').style.display = 'none';
            document.getElementById('inspect-banner').style.display = 'none';
            selectedTile = null;
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-input').focus();
            resetCameraOverview(false);
        }

        function showClue() {
            SoundEngine.playClick(700);
            const hb = document.getElementById('hint-box');
            hb.innerText = "💡 PETUNJUK: " + getCurrentQuestion().clue;
            hb.style.display = 'block';
        }

        function checkAnswer() {
            if (isWalking || pendingExplain) return;
            SoundEngine.init();

            const raw = document.getElementById('pin-input').value.trim().replace(/\s+/g, '').toLowerCase();
            const q = getCurrentQuestion();
            const fb = document.getElementById('fb-box');

            if (q.ans.includes(raw)) {
                SoundEngine.playCorrect();
                fb.style.display = 'none';
                pathHistory.push(q.pos);
                targetPos = { x: q.pos[0], y: q.pos[1] };
                isWalking = true;
                pendingExplain = q.explain;
                focusCameraOnGrid(targetPos.x, targetPos.y);
            } else {
                SoundEngine.playWrong();
                fb.innerText = "⚠️ JAWAPAN BELUM TEPAT: " + q.err;
                fb.style.display = 'block';
            }
        }

        function showCongratsModal(explainHtml) {
            document.getElementById('explain-text').innerHTML = explainHtml;
            document.getElementById('congrats-modal').style.display = 'flex';
        }

        function continueAfterCongrats() {
            SoundEngine.playClick(740);
            document.getElementById('congrats-modal').style.display = 'none';
            document.getElementById('curr-coord').innerText = `(${Math.round(playerPos.x)},${Math.round(playerPos.y)})`;

            const lvl = getCurrentLevel();
            if (currentQIdx + 1 < lvl.questions.length) {
                currentQIdx++;
                loadQuestion();
            } else {
                SoundEngine.playDoorOpen();
                levelCompletedPendingDoor = true;
                document.getElementById('door-title').innerText = lvl.doorTitle;
                document.getElementById('door-desc').innerText = lvl.doorDesc;
                document.getElementById('door-next-btn').innerText = lvl.btnText;
                document.getElementById('door-modal').style.display = 'flex';
            }
        }

        function proceedNextLevel() {
            if (!levelCompletedPendingDoor) return;
            SoundEngine.playClick(800);
            levelCompletedPendingDoor = false;
            document.getElementById('door-modal').style.display = 'none';

            if (currentLevelIdx + 1 < levels.length) {
                currentLevelIdx++;
                currentQIdx = 0;
                loadQuestion();
            } else {
                SoundEngine.playDoorOpen();
                gameFinished = true;
                document.getElementById('win-name').innerText = playerInfo.nama;
                document.getElementById('win-class').innerText = playerInfo.kelas;
                document.getElementById('win-time').innerText = document.getElementById('hud-timer').innerText;
                document.getElementById('win-modal').style.display = 'flex';
            }
        }

        function addKey(ch) {
            SoundEngine.init();
            SoundEngine.playClick(620);
            const inp = document.getElementById('pin-input');
            inp.value += ch;
            inp.focus();
        }

        function backspaceKey() {
            SoundEngine.init();
            SoundEngine.playClick(460);
            const inp = document.getElementById('pin-input');
            inp.value = inp.value.slice(0, -1);
            inp.focus();
        }

        function clearKey() {
            SoundEngine.init();
            SoundEngine.playClick(400);
            const inp = document.getElementById('pin-input');
            inp.value = '';
            inp.focus();
        }

        function toggleFormula(show) {
            SoundEngine.playClick(680);
            document.getElementById('formula-modal').style.display = show ? 'flex' : 'none';
        }

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
